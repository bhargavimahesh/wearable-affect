[project]
name = "wearable-affect"
version = "0.1.0"
description = "Stress detection from wrist-worn wearable signals (WESAD), from foundation model to production API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "neurokit2>=0.2.12",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "pytest>=9.1.1",
]
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
